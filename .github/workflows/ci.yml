name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Zero runtime dependencies. tzdata is only needed so PF-07 can validate
      # timezone names on Windows, which ships without an IANA database.
      - name: Install timezone data
        run: python -m pip install --quiet tzdata

      - name: Unit, safety-guard and demo-parity tests
        run: python -m unittest -v

  gate-smoke:
    name: CLI gate smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PASS scenario clears the gate (expect exit 0)
        run: python -m app.run_preflight --scenario synthetic-cmp-pass-001 --fail-on fail

      - name: FAIL scenario is blocked by the gate (expect exit 1)
        run: |
          set +e
          python -m app.run_preflight --scenario synthetic-cmp-fail-003 --fail-on fail
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "Expected exit 1, got $code"; exit 1; fi

      - name: Audited override releases the gate and writes approval.override
        run: |
          python -m app.run_preflight --scenario synthetic-cmp-fail-003 --fail-on fail \
            --audit .local/audit.jsonl --approve --approver "CI Demo Approver" \
            --reason "CI smoke test: synthetic override path, no real campaign."
          grep -q '"event_type": "approval.override"' .local/audit.jsonl

      - name: Upload audit sample
        uses: actions/upload-artifact@v4
        with:
          name: audit-sample
          path: .local/audit.jsonl
          retention-days: 7
